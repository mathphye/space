<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathphye Lab | Interactive classrooms</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Gloria+Hallelujah&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body class="notebook-theme hub-page">
    <div class="notebook-background">
        <svg width="100%" height="100%">
            <defs>
                <pattern id="dot-grid-hub" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="1" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="#fafafa" />
            <rect width="100%" height="100%" fill="url(#dot-grid-hub)" />
            <line x1="120" y1="0" x2="120" y2="100%" stroke="rgba(209, 77, 77, 0.1)" stroke-width="2" />
        </svg>
    </div>

    <main class="hub-content">
        <header class="hub-header">
            <p class="hub-eyebrow">Interactive notebooks</p>
            <h1 class="hub-title">Mathphye</h1>
            <p class="hub-subtitle">Elegí un laboratorio / Choose a lab</p>
        </header>

        <nav class="hub-labs" aria-label="Laboratories">
            <a href="waves.html" class="hub-lab-card">
                <span class="hub-lab-icon" aria-hidden="true">🌊</span>
                <h2 class="hub-lab-name">Wave Mechanics</h2>
                <p class="hub-lab-desc">Ondas, interferencia y visualización en el plano.</p>
                <span class="hub-lab-cta">Abrir laboratorio →</span>
            </a>
            <a href="robotics.html" class="hub-lab-card">
                <span class="hub-lab-icon" aria-hidden="true">🛰️</span>
                <h2 class="hub-lab-name">Robotics (i2D)</h2>
                <p class="hub-lab-desc">Brazo planar: cinemática directa e inversa.</p>
                <span class="hub-lab-cta">Abrir laboratorio →</span>
            </a>
        </nav>
    </main>
</body>

</html>
